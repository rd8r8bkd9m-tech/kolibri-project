name: Kolibri CI

on:
  push:
    branches: [ main, work ]
  pull_request:
  schedule:
    - cron: '0 3 * * *'

jobs:
  release-gate-backend:
    name: Release Gate — Backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Установка Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Установка Python-зависимостей
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Backend release gate
        run: ./scripts/release_gate.sh backend

  release-gate-native:
    name: Release Gate — Native Runtime
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Установка native-зависимостей
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build gcc-multilib libsqlite3-dev libssl-dev
      - name: Native release gate
        run: ./scripts/release_gate.sh native

  release-gate-frontend:
    name: Release Gate — Frontend + WASM
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - name: Установка Emscripten
        uses: mymindstorm/setup-emsdk@v13
        with:
          version: latest
      - name: Установка frontend-зависимостей
        run: npm ci
        working-directory: frontend
      - name: WASM release gate
        run: ./scripts/release_gate.sh wasm
      - name: Frontend release gate
        run: ./scripts/release_gate.sh frontend
      - name: Архив dist
        run: |
          tar -czf frontend-dist.tar.gz -C frontend dist
          sha256sum frontend-dist.tar.gz > frontend-dist.tar.gz.sha256
      - name: Публикация wasm-артефактов
        uses: actions/upload-artifact@v4
        with:
          name: kolibri-wasm
          path: |
            build/wasm/kolibri.wasm
            build/wasm/kolibri.wasm.sha256
            build/wasm/kolibri.wasm.txt
      - name: Публикация frontend-артефактов
        uses: actions/upload-artifact@v4
        with:
          name: kolibri-frontend-dist
          path: |
            frontend-dist.tar.gz
            frontend-dist.tar.gz.sha256

  release-bundle:
    name: Release Evidence Bundle
    runs-on: ubuntu-latest
    needs:
      - release-gate-backend
      - release-gate-native
      - release-gate-frontend
    steps:
      - uses: actions/checkout@v4
      - name: Download wasm artifact
        uses: actions/download-artifact@v4
        with:
          name: kolibri-wasm
          path: artifacts/wasm
      - name: Download frontend dist
        uses: actions/download-artifact@v4
        with:
          name: kolibri-frontend-dist
          path: artifacts/frontend
      - name: Prepare evidence docs
        run: |
          mkdir -p artifacts/docs
          cp README.md artifacts/docs/
          cp docs/PRODUCT_SPEC_V2.md artifacts/docs/
          cp docs/API_REFERENCE.md artifacts/docs/
          cp docs/PUBLIC_ARCHITECTURE.md artifacts/docs/
          cp docs/public_interfaces.md artifacts/docs/
          cp docs/QA_ACCEPTANCE.md artifacts/docs/
          cp docs/DEPLOY_RUNBOOK.md artifacts/docs/
          cp docs/RELEASE_CHECKLIST.md artifacts/docs/
          cp docs/INTEGRATION_SURFACES.md artifacts/docs/
          cp docs/release_notes.md artifacts/docs/
      - name: Prepare manifest
        run: |
          python3 - <<'PY'
          import json
          from datetime import datetime, timezone
          from pathlib import Path

          version = json.loads(Path("frontend/package.json").read_text(encoding="utf-8"))["version"]
          docs = [
              "README.md",
              "PRODUCT_SPEC_V2.md",
              "API_REFERENCE.md",
              "PUBLIC_ARCHITECTURE.md",
              "public_interfaces.md",
              "QA_ACCEPTANCE.md",
              "DEPLOY_RUNBOOK.md",
              "RELEASE_CHECKLIST.md",
              "INTEGRATION_SURFACES.md",
              "release_notes.md",
          ]
          manifest = {
              "version": f"v{version}",
              "date": datetime.now(timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ"),
              "gate": "release-gate",
              "artifacts": [
                  "artifacts/wasm/kolibri.wasm",
                  "artifacts/wasm/kolibri.wasm.sha256",
                  "artifacts/frontend/frontend-dist.tar.gz",
                  "artifacts/frontend/frontend-dist.tar.gz.sha256",
              ],
              "docs": docs,
          }
          Path("artifacts/release-manifest.json").write_text(
              json.dumps(manifest, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )
          PY
      - name: Upload release evidence
        uses: actions/upload-artifact@v4
        with:
          name: kolibri-release-evidence
          path: artifacts

  extended-security-sast:
    name: Extended CI — SAST
    runs-on: ubuntu-latest
    needs: release-gate-backend
    steps:
      - uses: actions/checkout@v4
      - name: Установка Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Установка Bandit + Semgrep
        run: |
          python -m pip install bandit semgrep
      - name: Bandit — Python SAST
        run: |
          bandit -r backend/service/ -f json -o bandit-report.json \
            --severity-level medium --confidence-level medium \
            -s B101 || true
          bandit -r backend/service/ --severity-level high --confidence-level high
      - name: Semgrep — мульти-язычный SAST
        run: |
          semgrep --config auto --config p/python --config p/security-audit \
            backend/service/ --json --output semgrep-report.json || true
          semgrep --config p/python --config p/security-audit \
            backend/service/ --error --severity ERROR
      - name: Upload SAST отчёты
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sast-reports
          path: |
            bandit-report.json
            semgrep-report.json

  extended-fuzz-parser:
    name: Extended CI — Parser fuzz smoke
    runs-on: ubuntu-latest
    needs: release-gate-native
    steps:
      - uses: actions/checkout@v4
      - name: Установка Clang и зависимостей
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build libsqlite3-dev libssl-dev
      - name: Конфигурация fuzz таргета
        run: cmake -S . -B build-fuzz -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo -DCMAKE_C_COMPILER=clang -DKOLIBRI_ENABLE_FUZZ=ON
      - name: Сборка fuzz таргета
        run: cmake --build build-fuzz --target kolibri_fuzz_script -j
      - name: Smoke fuzz run
        run: ./build-fuzz/kolibri_fuzz_script -runs=1000 -max_total_time=60

  extended-benchmark-regression:
    name: Extended CI — Benchmark regression
    runs-on: ubuntu-latest
    needs: release-gate-native
    steps:
      - uses: actions/checkout@v4
      - name: Установка зависимостей
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build gcc-multilib
      - name: Сборка benchmark
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release && cmake --build build --target kolibri_benchmark_suite -j
      - name: Запуск benchmark
        run: ./build/kolibri_benchmark_suite --json > benchmark_results.json
      - name: Проверка регрессии
        run: |
          python3 - <<'PY'
          import json
          import sys
          from pathlib import Path

          baseline_path = Path("benchmarks/baseline.json")
          results_path = Path("benchmark_results.json")

          if not results_path.exists():
              print("No benchmark results found")
              sys.exit(1)

          results = json.loads(results_path.read_text())
          if baseline_path.exists():
              baseline = json.loads(baseline_path.read_text())
              max_degradation = 0.10

              for key, value in results.items():
                  if key not in baseline or baseline[key] <= 0:
                      continue
                  degradation = (value - baseline[key]) / baseline[key]
                  if degradation > max_degradation:
                      print(f"REGRESSION: {key} degraded by {degradation:.1%}")
                      sys.exit(1)

          print("Benchmark regression check passed")
          PY
      - name: Сохранение результатов
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: benchmark-results
          path: benchmark_results.json

  extended-iso-package:
    name: Extended CI — ISO packaging
    runs-on: ubuntu-latest
    needs: release-gate-native
    steps:
      - uses: actions/checkout@v4
      - name: Установка зависимостей C/ISO
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-multilib grub-pc-bin nasm xorriso
      - name: Сборка ISO
        run: ./scripts/build_iso.sh
      - name: SHA256 ISO
        run: sha256sum build/kolibri.iso > build/kolibri.iso.sha256
      - name: Публикация ISO-артефактов
        uses: actions/upload-artifact@v4
        with:
          name: kolibri-iso
          path: |
            build/kolibri.iso
            build/kolibri.iso.sha256

  extended-docker-smoke:
    name: Extended CI — Docker packaging smoke
    runs-on: ubuntu-latest
    needs: release-gate-frontend
    steps:
      - uses: actions/checkout@v4
      - name: Build backend image
        run: docker build -f backend/Dockerfile -t kolibri-backend:ci .
      - name: Build indexer image
        run: docker build -f apps/Dockerfile.indexer -t kolibri-indexer:ci .
      - name: Build frontend image
        run: docker build -f frontend/Dockerfile -t kolibri-frontend:ci .
      - name: Smoke backend container
        run: |
          docker rm -f kolibri-backend-ci-test 2>/dev/null || true
          docker run -d --name kolibri-backend-ci-test -p 4051:4050 kolibri-backend:ci --listen 4050
          sleep 5
          docker logs kolibri-backend-ci-test | tail -n 20 || true
          docker rm -f kolibri-backend-ci-test
      - name: Smoke indexer container
        run: docker run --rm kolibri-indexer:ci --help
      - name: Smoke frontend container
        run: |
          docker rm -f kolibri-frontend-ci-test 2>/dev/null || true
          docker run -d --name kolibri-frontend-ci-test -p 8081:80 kolibri-frontend:ci
          sleep 5
          docker logs kolibri-frontend-ci-test | tail -n 20 || true
          docker rm -f kolibri-frontend-ci-test
      - name: Test deployment script
        run: |
          rm -rf ci-install
          mkdir -p ci-install
          ./scripts/deploy_linux.sh --version ci --backend-image kolibri-backend:ci --frontend-image kolibri-frontend:ci --skip-pull --prefix "$(pwd)/ci-install"
          docker ps --format '{{.Names}}'
          docker stop kolibri-backend kolibri-frontend
          docker rm kolibri-backend kolibri-frontend

  extended-run-all-smoke:
    name: Extended CI — run_all smoke
    runs-on: ubuntu-latest
    needs: extended-docker-smoke
    steps:
      - uses: actions/checkout@v4
      - name: Установка Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - name: Установка Emscripten
        uses: mymindstorm/setup-emsdk@v13
        with:
          version: latest
      - name: Установка системных зависимостей
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build gcc-multilib grub-pc-bin nasm xorriso libsqlite3-dev libssl-dev
      - name: Bootstrap active contour
        run: ./scripts/release_gate.sh bootstrap
      - name: Execute scripts/run_all.sh
        run: ./scripts/run_all.sh --skip-cluster
