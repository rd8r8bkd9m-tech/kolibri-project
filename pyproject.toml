[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kolibri-os"
version = "0.1.0"
description = "Kolibri OS - Knowledge-based Operating System"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "Kolibri OS Team", email = "team@kolibrios.com"}
]
keywords = ["os", "knowledge", "ai", "distributed"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "asyncpg>=0.29,<0.30",
    "clickhouse-connect>=0.6,<0.7",
    "coverage[toml]>=7.4,<8",
    "fastapi>=0.110,<0.112",
    "httpx>=0.27,<0.28",
    "pyright>=1.1.350,<1.2",
    "pytest>=7.4,<9",
    "ruff>=0.4.0,<0.5",
    "uvicorn[standard]>=0.29,<0.31",
]

[project.optional-dependencies]
dev = [
    "black>=24.0",
    "isort>=5.13",
    "pytest-cov>=4.1",
    "mypy>=1.8",
]

[project.urls]
Homepage = "https://github.com/kolibrios/kolibri-os"
Documentation = "https://kolibrios.readthedocs.io"
Repository = "https://github.com/kolibrios/kolibri-os.git"
Issues = "https://github.com/kolibrios/kolibri-os/issues"

[tool.black]
line-length = 88
target-version = ['py310', 'py311', 'py312']
include = '\.pyi?$'
exclude = '''
/(
    \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
  | _codeql_detected_source_root
)/
'''

[tool.isort]
profile = "black"
line_length = 88
skip = ["_codeql_detected_source_root", "build", "venv", ".venv"]

[tool.ruff]
line-length = 88
target-version = "py310"
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # Pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]
ignore = ["E501"]  # line too long (handled by black)

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

[tool.coverage.run]
source = ["."]
omit = [
    "*/tests/*",
    "*/_codeql_detected_source_root/*",
    "*/build/*",
    "*/venv/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
